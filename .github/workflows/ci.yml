name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install -e ".[dev]"
      - name: Foundation and model tests (structure, secrets, large files, configs, reference decoder)
        env:
          NAWA_REQUIRE_TORCH: "1"   # P3-04 tests must fail, not skip, if torch is missing
        run: python -m pytest
      - name: Memory self-check (P7-05, synthetic users only; determinism, isolation, no trace after deletion)
        run: |
          python -m nawa.memory.replay --check --seed 7 --ops 300
          a=$(PYTHONHASHSEED=0 python -m nawa.memory.replay --seed 7 --ops 300)
          b=$(PYTHONHASHSEED=4242 python -m nawa.memory.replay --seed 7 --ops 300)
          test "$a" = "$b" && echo "memory replay digest identical across processes: $a"
      - name: detect-secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
